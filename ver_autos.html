<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="img/icono.png">
    <title>BequianRent | Nuestra Flota</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="css/styles.css">

    <script src="https://kit.fontawesome.com/e3899a1d0c.js" crossorigin="anonymous"></script>
    
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow">
        <div class="container">
            <a class="brand-logo" href="index.html">
                <img src="img/logo.png" alt="BequianRent" height="80" class="d-inline-block align-text-top">
            </a>
            
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto" id="menuNavegacion">
                </ul>
            </div>
        </div>
    </nav>

    <div class="bg-primary text-white py-4 mb-4 text-center header-flota">
            <h2 class="fw-bold">Nuestra Flota</h2>
            <p class="text-white">Encuentra el vehículo perfecto para ti</p>
        </div>
    <div class="container">
        <div class="row g-4">
        
            <aside class="col-12 col-md-4 col-lg-3">
                <div class="filtros-box shadow-sm p-4 border">
                    <h5 class="fw-bold mb-3 d-flex justify-content-between align-items-center">
                        Filtros
                        <button class="btn btn-sm btn-outline-secondary" id="btn-limpiar">Limpiar</button>
                    </h5>
                    
                    <form id="formFiltros">
                        <div class="mb-3">
                            <label for="filtro-marca" class="form-label small fw-bold text-muted">Marca</label>
                            <select id="filtro-marca" class="form-select">
                                <option value="">Todas las marcas</option>
                                </select>
                        </div>
                        
                        <div class="mb-3">
                            <label for="filtro-anio" class="form-label small fw-bold text-muted">Año</label>
                            <select id="filtro-anio" class="form-select">
                                <option value="">Cualquier año</option>
                                </select>
                        </div>
                        
                        <div class="mb-3">
                            <label for="filtro-disponible" class="form-label small fw-bold text-muted">Disponibilidad</label>
                            <select id="filtro-disponible" class="form-select">
                                <option value="">Todos</option>
                                <option value="true">Solo Disponibles</option>
                                <option value="false">No Disponibles</option>
                            </select>
                        </div>
                    </form>
                    
                    <div class="mt-4 text-muted small border-top pt-2" id="contador-resultados">
                        Cargando vehículos...
                    </div>
                </div>
            </aside>

            <main class="col-12 col-md-8 col-lg-9">
                <div class="row g-4 mb-4" id="contenedor-autos">
                    
                    <div class="col-12 text-center py-5 d-none" id="sin-resultados">
                        <p class="fs-4 text-muted">No se encontraron vehículos con estos filtros.</p>
                        <button class="btn btn-outline-primary mt-2" onclick="document.getElementById('btn-limpiar').click()">Ver todos los vehículos</button>
                    </div>

                </div>
            </main>

        </div>
    </div>

    <footer class="bg-dark text-white text-center py-4 mt-auto">
        <div class="container">
            <p class="mb-0">&copy; 2026 BequianRent - Proyecto WEB - DuocUc Online</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <script src="js/app.js"></script>
    <script src="js/ver_autos.js"></script>
</body>
</html>
