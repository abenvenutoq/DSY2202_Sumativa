<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="img/icono.png">
    <title>BequianRent | Panel de Administración</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="css/styles.css">

    <script src="https://kit.fontawesome.com/e3899a1d0c.js" crossorigin="anonymous"></script>

</head>
<body>

    <!--Barra de Navegación-->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow">
        <div class="container">
            <a class="brand-logo" href="index.html">
                <img src="img/logo.png" alt="BequianRent" height="80" class="d-inline-block align-text-top">
            </a>
            
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">

                <!--Menu de nevegación gestionado segun rol sesion-->
                <ul class="navbar-nav ms-auto" id="menuNavegacion">
                </ul>
                
            </div>
        </div>
    </nav>

    <div class="bg-primary text-white py-4 mb-4 text-center header-global">
        <h2 class="fw-bold"><i class="fa-solid fa-users-gear me-2"></i>Panel Administración</h2>
        <p class="text-white">Panel administración de BequianRent</p>
    </div>


    <div class="container my-5 flex-grow-1">
        <div class="row">
            
            <div class="col-md-3 mb-4">
                <div class="card shadow-sm border-0 p-3 bg-white mb-4" style="border-radius: 10px;">
                    <div class="d-flex flex-column gap-2">
                        <button class="btn btn-light w-100 text-start fw-semibold" id="btn-usuarios" onclick="cambiarVista('usuarios')">
                            <i class="fa-solid fa-users me-2"></i>Usuarios Registrados
                        </button>
                        <button class="btn btn-light w-100 text-start fw-semibold" id="btn-reservas" onclick="cambiarVista('reservas')">
                            <i class="fa-solid fa-calendar-days me-2"></i>Reservas Realizadas
                        </button>
                        
                        <button class="btn btn-light w-100 text-start fw-semibold" id="btn-vehiculos" onclick="cambiarVista('vehiculos')">
                            <i class="fa-solid fa-car me-2"></i>Vehículos en Flota
                        </button>
                    </div>
                </div>
            </div>

            <div class="col-md-9">
                <div class="card shadow-sm border-0 p-4 bg-white" style="border-radius: 10px;">
                    <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-2">
                        <h2 class="h4 fw-bold mb-0 text-dark" id="panel-titulo">Usuarios Registrados</h2>
                        <span class="badge bg-primary fs-6" id="panel-contador">0</span>
                    </div>

                    <div class="table-responsive" id="panel-tabla-contenedor">
                        <div class="text-center py-5">
                            <div class="spinner-border text-primary" role="status">
                                <span class="visually-hidden">Cargando...</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <footer class="bg-dark text-white text-center py-4 mt-auto">
        <div class="container">
            <p class="mb-0">&copy; 2026 BequianRent - Proyecto WEB - DuocUc Online</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
    <script src="js/admin_panel.js"></script>
</body>
</html>
