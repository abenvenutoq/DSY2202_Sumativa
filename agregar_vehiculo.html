<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="img/icono.png">
    <title>BequianRent | Nuestra Flota</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="css/styles.css">

    <script src="https://kit.fontawesome.com/e3899a1d0c.js" crossorigin="anonymous"></script>
    
</head>
<body>

    <!--Barra de Navegación-->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow">
        <div class="container">
            <a class="brand-logo" href="index.html">
                <img src="img/logo.png" alt="BequianRent" height="80" class="d-inline-block align-text-top">
            </a>
            
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">

                <!--Menu de nevegación gestionado segun rol sesion-->
                <ul class="navbar-nav ms-auto" id="menuNavegacion">
                </ul>
                
            </div>
        </div>
    </nav>

    <div class="bg-primary text-white py-4 mb-4 text-center header-global">
        <h2 class="fw-bold"><i class="fa-solid fa-plus me-2"></i>Agregar Vehículo</h2>
        <p class="text-white">Agrega vehiculos a la flota</p>
    </div>

    <div class="container mb-5 flex-grow-1">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow-sm border-0 p-4 bg-white" style="border-radius: 10px;">
                    
                    <form id="form-agregar-vehiculo">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Marca *</label>
                                <select id="add-marca" class="form-select">
                                    <option value="Seleccione Marca" selected>Seleccióne Opción</option>
                                    <option value="Toyota">Toyota</option>
                                    <option value="Mazda">Mazda</option>
                                    <option value="Volkswagen">Volkswagen</option>
                                </select>
                                <div class="invalid-feedback" id="add-marca-error"></div>
                            </div>
                            
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Modelo *</label>
                                <input type="text" id="add-modelo" class="form-control" placeholder="Ej: Corolla">
                                <div class="invalid-feedback" id="add-modelo-error"></div>
                            </div>
                            
                            <div class="col-md-4">
                                <label class="form-label fw-semibold">Año *</label>
                                <input type="number" id="add-anio" class="form-control" placeholder="Ej: 2024" min="2000" max="2027">
                                <div class="invalid-feedback" id="add-anio-error"></div>
                            </div>
                            
                            <div class="col-md-4">
                                <label class="form-label fw-semibold">Tipo *</label>
                                <select id="add-tipo" class="form-select">
                                    <option value="Seleccione Tipo" selected>Seleccióne Opción</option>
                                    <option value="Sedán">Sedán</option>
                                    <option value="Hatchback">Hatchback</option>
                                </select>
                                <div class="invalid-feedback" id="add-tipo-error"></div>
                            </div>
                            
                            <div class="col-md-4">
                                <label class="form-label fw-semibold">Transmisión *</label>
                                <select id="add-transmision" class="form-select">
                                    <option value="Seleccione Transmisión" selected>Seleccióne Opción</option>
                                    <option value="Automática">Automática</option>
                                    <option value="Mecánica">Mecánica</option>
                                </select>
                                <div class="invalid-feedback" id="add-transmision-error"></div>
                            </div>
                            
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Precio por Día ($) *</label>
                                <input type="number" id="add-precio" class="form-control" placeholder="Ej: 45000">
                                <div class="invalid-feedback" id="add-precio-error"></div>
                            </div>
                            
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">URL de la Imagen (Opcional)</label>
                                <input type="text" id="add-imagen" class="form-control" placeholder="Ej: img/autos/toyota.png">
                            </div>
                        </div>

                        <div class="mt-3 mb-2">
                            <small class="text-muted">* Campos obligatorios</small>
                        </div>

                        <div class="d-flex justify-content-between mt-4 pt-3 border-top">
                            <a href="admin_panel.html" class="btn btn-secondary fw-semibold">
                                <i class="fa-solid fa-arrow-left me-1"></i>Volver al Panel
                            </a>
                            <button type="submit" class="btn btn-success fw-semibold px-4">
                                <i class="fa-solid fa-floppy-disk me-1"></i>Guardar Vehículo
                            </button>
                        </div>
                    </form>

                </div>
            </div>
        </div>
    </div>

    <footer class="bg-dark text-white text-center py-4 mt-auto">
        <div class="container">
            <p class="mb-0">&copy; 2026 BequianRent - Proyecto WEB - DuocUc Online</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <script src="js/app.js"></script>
    <script src="js/agregar_vehiculo.js"></script>
</body>
</html>
