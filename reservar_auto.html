<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="img/icono.png">
    <title>BequianRent | Reservar Vehículo</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <script src="https://kit.fontawesome.com/e3899a1d0c.js" crossorigin="anonymous"></script>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow">
        <div class="container">
            <a class="brand-logo" href="index.html">
                <img src="img/logo.png" alt="BequianRent" height="80" class="d-inline-block align-text-top">
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto" id="menuNavegacion">
                    </ul>
            </div>
        </div>
    </nav>

    <div class="bg-primary text-white py-4 mb-4 text-center header-global">
        <h2 class="fw-bold">Configura tu Reserva</h2>
        <p class="text-white">¡Estás a un paso de disfrutar tu próximo viaje!</p>
    </div>

    <div class="container mb-5 flex-grow-1">
        <div class="row g-4" id="reserva-contenedor-principal">
            
            <div class="col-md-6">
                <div class="card shadow-sm border-0 h-100" id="detalle-vehiculo-card">
                    <div class="text-center p-5">
                        <div class="spinner-border text-primary" role="status">
                            <span class="visually-hidden">Cargando vehículo...</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-md-6">
                <div class="card shadow-sm border-0 p-4 bg-white h-100" style="border-radius: 10px;">
                    <h4 class="fw-bold text-dark mb-4 border-bottom pb-2"><i class="fa-solid fa-calendar-days text-primary me-2"></i>Fechas del Arriendo</h4>
                    
                    <div class="alert alert-danger d-none" id="reserva-error-alerta" role="alert"></div>

                    <form id="formReserva">
                        <div class="mb-3">
                            <label for="fechaDesde" class="form-label fw-semibold">Fecha de Retiro (Inicio)</label>
                            <input type="date" class="form-control form-control-lg" id="fechaDesde" required>
                        </div>

                        <div class="mb-4">
                            <label for="fechaHasta" class="form-label fw-semibold">Fecha de Devolución (Término)</label>
                            <input type="date" class="form-control form-control-lg" id="fechaHasta" required>
                        </div>

                        <div class="bg-light rounded p-3 mb-4 border text-dark">
                            <div class="d-flex justify-content-between mb-2">
                                <span>Cantidad de Días:</span>
                                <span id="resumen-dias" class="fw-bold">0 días</span>
                            </div>
                            <div class="d-flex justify-content-between align-items-center border-top pt-2 mt-2">
                                <span class="fs-5 fw-semibold">Total a Pagar:</span>
                                <span id="resumen-total" class="fs-4 fw-bold text-success">$0</span>
                            </div>
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary btn-lg fw-bold py-3 shadow-sm" id="btnConfirmarReserva">
                                <i class="fa-solid fa-circle-check me-2"></i>Confirmar y Reservar
                            </button>
                            <a href="ver_autos.html" class="btn btn-outline-secondary btn-sm mt-2">Volver a la galería</a>
                        </div>
                    </form>
                </div>
            </div>

        </div>
    </div>

    <footer class="bg-dark text-white text-center py-4 mt-auto">
        <div class="container">
            <p class="mb-0">&copy; 2026 BequianRent - Proyecto WEB - DuocUc Online</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
    <script src="js/reservar_auto.js"></script>
</body>
</html>
