<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="img/icono.png">
    <title>BequianRent | Mi Perfil</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <link rel="stylesheet" href="css/styles.css">

    <script src="https://kit.fontawesome.com/e3899a1d0c.js" crossorigin="anonymous"></script>
    
</head>
<body>

    <!--Barra de Navegación-->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow">
        <div class="container">
            <a class="brand-logo" href="index.html">
                <img src="img/logo.png" alt="BequianRent" height="80" class="d-inline-block align-text-top">
            </a>
            
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">

                <!--Menu de nevegación gestionado segun rol sesion-->
                <ul class="navbar-nav ms-auto" id="menuNavegacion">
                </ul>
                
            </div>
        </div>
    </nav>

    <div class="bg-primary text-white py-4 mb-4 text-center header-global">
        <h2 class="fw-bold"><i class="fa-solid fa-address-card me-2"></i>MI Perfil</h2>
        <p class="text-white">Gestiona tu información personal</p>
    </div>

    <main class="container my-5 flex-grow-1">
        <div class="row justify-content-center">
            <div class="col-12 col-lg-10">
                <div class="card shadow rounded-4 overflow-hidden border-0">
                    <div class="row g-0">
                        
                        <div class="col-md-4 bg-light border-end d-flex flex-column align-items-center justify-content-center p-5">
                            <div class="avatar-circle mb-3 mx-auto">
                                <i class="fa-solid fa-user" id="avatarIcon"></i>
                            </div>
                            <h4 class="fw-bold mb-1 text-center" id="resumenNombre">Cargando...</h4>
                            <span class="badge bg-primary px-3 py-2 rounded-pill mt-2" id="resumenRol">Cargando...</span>
                        </div>

                        <div class="col-md-8 p-5">
                            <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-3">
                                <h4 class="fw-bold text-primary mb-0">Información Personal</h4>
                            </div>

                            <div class="row g-4">
                                <div class="col-md-6">
                                    <label class="text-muted small fw-bold text-uppercase mb-1">Nombre Completo</label>
                                    <p class="fs-5 mb-0" id="perfilNombre">-</p>
                                </div>
                                <div class="col-md-6">
                                    <label class="text-muted small fw-bold text-uppercase mb-1">RUT</label>
                                    <p class="fs-5 mb-0" id="perfilRut">-</p>
                                </div>
                                <div class="col-md-6">
                                    <label class="text-muted small fw-bold text-uppercase mb-1">Correo Electrónico</label>
                                    <p class="fs-5 mb-0" id="perfilCorreo">-</p>
                                </div>
                                <div class="col-md-6">
                                    <label class="text-muted small fw-bold text-uppercase mb-1">Teléfono</label>
                                    <p class="fs-5 mb-0" id="perfilTelefono">-</p>
                                </div>
                                <div class="col-12">
                                    <label class="text-muted small fw-bold text-uppercase mb-1">Dirección</label>
                                    <p class="fs-5 mb-0" id="perfilDireccion">-</p>
                                </div>
                            </div>

                            <div class="mt-5 pt-3">
                                <button onclick="window.location.href='editar_perfil.html'" class="btn btn-outline-primary px-4">
                                    <i class="fa-solid fa-pen me-2"></i> Editar Datos
                                </button>
                            </div>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-dark text-white text-center py-4 mt-auto">
        <div class="container">
            <p class="mb-0">&copy; 2026 BequianRent - Proyecto WEB - DuocUc Online</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <script src="js/app.js"></script>
    <script src="js/mi_perfil.js"></script>
</body>
</html>
