<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BequianRent | Login</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <!--Barra de Navegación-->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow">
        <div class="container">
            <a class="brand-logo" href="index.html">
                <img src="img/logo.png" alt="BequianRent" height="80" class="d-inline-block align-text-top">
            </a>
            
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">

                <!--Menu de nevegación gestionado segun rol sesion-->
                <ul class="navbar-nav ms-auto" id="menuNavegacion">
                </ul>
                
            </div>
        </div>
    </nav>

    <div class="container my-5 py-5">
        <div class="row justify-content-center">
            <div class="col-12 col-lg-6 col-md-10"> 
                <div class="card shadow-lg border-0 login-container">
                    
                    <div class="card-header text-center text-white py-4 card-header-login">
                        <h3 class="mb-0 fw-bold">Bienvenido de nuevo</h3>
                        <p class="mb-0 small text-white-50">Ingresa a tu cuenta de BequianRent</p>
                    </div>
                    
                    <div class="card-body p-4 p-md-5">
                        
                        <div id="login-error" class="alert alert-danger d-none text-center" role="alert">
                            Correo o contraseña incorrectos.
                        </div>

                        <form id="formLogin" novalidate>
                            
                            <div class="mb-4">
                                <label for="login-correo" class="form-label fw-semibold">Correo Electrónico</label>
                                <input type="email" class="form-control form-control-lg" id="login-correo" placeholder="ejemplo@correo.com" required>
                                <div class="invalid-feedback">Por favor ingresa tu correo.</div>
                            </div>

                            <div class="mb-4">
                                <div class="d-flex justify-content-between align-items-center">
                                    <label for="login-password" class="form-label fw-semibold mb-0">Contraseña</label>
                                    <a href="#" class="small text-decoration-none">¿Olvidaste tu contraseña?</a>
                                </div>
                                <input type="password" class="form-control form-control-lg mt-2" id="login-password" placeholder="••••••••" required>
                                <div class="invalid-feedback">Por favor ingresa tu contraseña.</div>
                            </div>

                            <div class="mb-4 form-check">
                                <input type="checkbox" class="form-check-input" id="recordarme">
                                <label class="form-check-label" for="recordarme">Recordar mi sesión</label>
                            </div>

                            <div class="d-grid mb-4">
                                <button type="submit" class="btn btn-primary btn-lg btn-login text-white">Ingresar</button>
                            </div>

                            <div class="text-center">
                                <p class="mb-0 text-muted">¿No tienes una cuenta? <a href="registro_clientes.html" class="text-decoration-none fw-bold">Regístrate aquí</a></p>
                            </div>
                            
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer class="bg-dark text-white text-center py-4 mt-auto">
        <div class="container">
            <p class="mb-0">&copy; 2026 BequianRent - Proyecto WEB - DuocUc Online</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <script src="js/app.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
